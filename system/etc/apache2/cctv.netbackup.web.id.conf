<VirtualHost *:80>
    ServerName cctv.netbackup.web.id
    Redirect permanent / https://cctv.netbackup.web.id/
</VirtualHost>

<VirtualHost *:443>
    ServerName cctv.netbackup.web.id
    DocumentRoot /var/www/cctv.netbackup.web.id/frontend
    Alias /frontend /var/www/cctv.netbackup.web.id/frontend

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/cctv.netbackup.web.id/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/cctv.netbackup.web.id/privkey.pem

    ProxyPreserveHost On
    ProxyPass /api http://127.0.0.1:8000/api
    ProxyPassReverse /api http://127.0.0.1:8000/api
    ProxyPass /static http://127.0.0.1:8000/static
    ProxyPassReverse /static http://127.0.0.1:8000/static
    ProxyPass /media/ http://127.0.0.1:8889/
    ProxyPassReverse /media/ http://127.0.0.1:8889/
    ProxyPass /media-hls/ http://127.0.0.1:8888/
    ProxyPassReverse /media-hls/ http://127.0.0.1:8888/

    <Directory /var/www/cctv.netbackup.web.id/frontend>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/cctv.netbackup.web.id_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/cctv.netbackup.web.id_ssl_access.log combined
</VirtualHost>
